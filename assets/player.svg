<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Player profile: Rafaelcarvalho320, Computer Engineering student in Belém, PA. Now playing: API integrations and resilient backends.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#0b1330"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ea8ff"/>
      <stop offset="0.5" stop-color="#3ddbb4"/>
      <stop offset="1" stop-color="#e08ad8"/>
    </linearGradient>
    <linearGradient id="thumb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16307a"/>
      <stop offset="1" stop-color="#0a1330"/>
    </linearGradient>
    <clipPath id="thumbClip"><rect x="800" y="70" width="320" height="140" rx="10"/></clipPath>
    <style>
      .t { font-family: 'Segoe UI', 'SF Pro Display', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .spin { transform-box: fill-box; transform-origin: center; animation: spin 12s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .eq rect { transform-box: fill-box; transform-origin: bottom; animation: eq 1.2s ease-in-out infinite; }
      .eq rect:nth-child(2) { animation-delay: -.4s; }
      .eq rect:nth-child(3) { animation-delay: -.8s; }
      @keyframes eq { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
      .dot { animation: blink 1.8s ease-in-out infinite; }
      @keyframes blink { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="1200" height="280" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="279" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".07"/>

  <!-- avatar -->
  <circle class="spin" cx="160" cy="140" r="78" fill="none" stroke="url(#ring)" stroke-width="3" stroke-dasharray="340 150" stroke-linecap="round"/>
  <circle cx="160" cy="140" r="68" fill="#0f1628"/>
  <text class="t" x="160" y="156" text-anchor="middle" font-size="46" font-weight="300" fill="#e8eefb" letter-spacing="2">RC</text>
  <circle cx="212" cy="192" r="11" fill="#0a0e1a"/>
  <circle class="dot" cx="212" cy="192" r="7" fill="#3ddbb4"/>

  <!-- identity -->
  <g class="t">
    <text x="280" y="92" font-size="12" letter-spacing="4" fill="#6f7a93">ONLINE ID</text>
    <text x="278" y="132" font-size="34" font-weight="400" fill="#f2f5fb">Rafaelcarvalho320</text>
    <text x="280" y="166" font-size="17" fill="#a9bde6">Computer Engineering Student</text>
    <text x="280" y="194" font-size="15" fill="#6f7a93">Belém, PA · Brazil · Player since 2022</text>
  </g>
  <!-- tags -->
  <g class="t" font-size="12" letter-spacing="2">
    <rect x="280" y="214" width="92" height="26" rx="13" fill="#6ea8ff" fill-opacity=".12" stroke="#6ea8ff" stroke-opacity=".35"/>
    <text x="326" y="231" text-anchor="middle" fill="#9cc3ff">BACKEND</text>
    <rect x="382" y="214" width="100" height="26" rx="13" fill="#3ddbb4" fill-opacity=".1" stroke="#3ddbb4" stroke-opacity=".35"/>
    <text x="432" y="231" text-anchor="middle" fill="#7fe8cc">FRONTEND</text>
    <rect x="492" y="214" width="76" height="26" rx="13" fill="#e08ad8" fill-opacity=".1" stroke="#e08ad8" stroke-opacity=".35"/>
    <text x="530" y="231" text-anchor="middle" fill="#efb6ea">DATA</text>
  </g>

  <!-- divider -->
  <line x1="760" y1="50" x2="760" y2="230" stroke="#ffffff" stroke-opacity=".07"/>

  <!-- now playing -->
  <g class="t">
    <text x="800" y="54" font-size="12" letter-spacing="4" fill="#6f7a93">NOW PLAYING</text>
    <g class="eq" fill="#3ddbb4">
      <rect x="1100" y="42" width="4" height="14" rx="1"/>
      <rect x="1107" y="42" width="4" height="14" rx="1"/>
      <rect x="1114" y="42" width="4" height="14" rx="1"/>
    </g>
  </g>
  <rect x="800" y="70" width="320" height="140" rx="10" fill="url(#thumb)"/>
  <g clip-path="url(#thumbClip)" fill="none" stroke-width="1.4">
    <path d="M800 170 Q880 140 960 170 T1120 170" stroke="#9cc3ff" stroke-opacity=".5"/>
    <path d="M800 182 Q880 206 960 182 T1120 182" stroke="#ffffff" stroke-opacity=".2"/>
    <circle cx="1070" cy="104" r="44" stroke="#6ea8ff" stroke-opacity=".25"/>
    <circle cx="1070" cy="104" r="26" stroke="#6ea8ff" stroke-opacity=".4"/>
  </g>
  <g class="t">
    <text x="820" y="108" font-size="20" font-weight="500" fill="#f2f5fb">API Integrations</text>
    <text x="820" y="132" font-size="14" fill="#a9bde6">&amp; resilient backends</text>
    <text x="800" y="236" font-size="13" fill="#6f7a93">Django · DRF · PostgreSQL · Docker</text>
  </g>
</svg>
