<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="568" viewBox="0 0 1200 568" role="img" aria-label="Trophies: tech stack. Platinum Python; Gold Django, DRF, React and TypeScript; Silver PostgreSQL, Docker, Next.js; Bronze pytest, OpenCV, Machine Learning.">
  <defs><linearGradient id="platinum" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f8ff"/><stop offset="1" stop-color="#9fb2d4"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#c98a1e"/></linearGradient><linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef1f5"/><stop offset="1" stop-color="#8e98a6"/></linearGradient><linearGradient id="bronze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0b27f"/><stop offset="1" stop-color="#9a5427"/></linearGradient><symbol id="cup" viewBox="0 0 40 40"><path d="M11 5 H29 V13 C29 20 25 24 20 24 C15 24 11 20 11 13 Z"/><path d="M11 8 H6 V11 C6 15 8.5 17.5 12 17.5 M29 8 H34 V11 C34 15 31.5 17.5 28 17.5" fill="none" stroke-width="2.4"/><rect x="18" y="24" width="4" height="6"/><rect x="12" y="30" width="16" height="4.5" rx="1.2"/></symbol>
    <style>
