      @keyframes shine { 0%, 70%, 100% { opacity: 0; transform: translateX(0); } 80% { opacity: .5; } 95% { opacity: 0; transform: translateX(560px); } }
    </style>
    <linearGradient id="glint" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
