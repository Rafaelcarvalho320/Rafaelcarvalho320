odern React frontends with Next.js 14</text><text x="532" y="31" text-anchor="end" font-size="10.5" letter-spacing="2.5" fill="url(#silver)">SILVER</text></g><g transform="translate(612 288)"><rect width="552" height="70" rx="12" fill="#0f1628" stroke="#ffffff" stroke-opacity=".05"/><circle cx="38" cy="35" r="24" fill="url(#bronze)" fill-opacity=".1"/><use href="#cup" x="20" y="17" width="36" height="36" fill="url(#bronze)" stroke="url(#bronze)"/><text x="78" y="31" font-size="18" font-weight="500" fill="#f2f5fb">pytest</text><text x="78" y="53" font-size="13.5" fill="#8a93a8">Test suites, CI and a custom pytest plugin</text><text x="532" y="31" text-anchor="end" font-size="10.5" letter-spacing="2.5" fill="url(#bronze)">BRONZE</text></g><g transform="translate(612 372)"><rect width="552" height="70" rx="12" fill="#0f1628" stroke="#ffffff" stroke-opacity=".05"/><circle cx="38" cy="35" r="24" fill="url(#bronze)" fill-opacity=".1"/><use href="#cup" x="20" y="17" width="36" height="36" fill="url(#bronze)" stroke="url(#bronze)"/><text x="78" y="31" font-size="18" font-weight="500" fill="#f2f5fb">OpenCV</text><text x="78" y="53" font-size="13.5" fill="#8a93a8">Lesion segmentation and symmetry scoring</text><text x="532" y="31" text-anchor="end" font-size="10.5" letter-spacing="2.5" fill="url(#bronze)">BRONZE</text></g><g transform="translate(612 456)"><rect width="552" height="70" rx="12" fill="#0f1628" stroke="#ffffff" stroke-opacity=".05"/><circle cx="38" cy="35" r="24" fill="url(#bronze)" fill-opacity=".1"/><use href="#cup" x="20" y="17" width="36" height="36" fill="url(#bronze)" stroke="url(#bronze)"/><text x="78" y="31" font-size="18" font-weight="500" fill="#f2f5fb">Machine Learning</text><text x="78" y="53" font-size="13.5" fill="#8a93a8">SVM, AdaBoost and Jupyter experiments</text><text x="532" y="31" text-anchor="end" font-size="10.5" letter-spacing="2.5" fill="url(#bronze)">BRONZE</text></g>
